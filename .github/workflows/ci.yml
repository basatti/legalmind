name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legalmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/legalmind_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        id: deps
        working-directory: backend
        run: uv sync --extra dev

      # LEG-93 reordered these so a type error could not hide the test results,
      # but reordering only moves which check gets skipped - a ruff failure
      # still ended the job with zero tests reported. Each check now runs even
      # when an earlier one failed, so one run tells you everything that is
      # broken instead of only the first thing.
      #
      # `!cancelled()` rather than `always()`: always() keeps running steps
      # after someone cancels the run. The extra `steps.deps` guard skips the
      # checks when the install never succeeded, where all four would fail for
      # the same uninteresting reason. A failing check still fails the job.
      - name: Lint (ruff)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (ruff)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: uv run ruff format --check .

      - name: Tests (pytest)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: uv run pytest

      - name: Type check (mypy)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: backend
        run: uv run mypy

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches frontend/Dockerfile (node:22-slim). On 20 this job could go
          # green against a Node the shipped image never runs.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build (next build)
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
