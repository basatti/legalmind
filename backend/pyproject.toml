[project]
name = "backend"
version = "0.1.0"
description = "Backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt>=4.2",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "langfuse>=4.14.2",
    "langgraph>=1.2.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
evals = [
    # Pinned below 0.3: 0.4.x's ragas.llms.base unconditionally imports
    # langchain_community's Vertex AI integration, which 500s on import
    # unless the unrelated langchain-google-vertexai extra is installed.
    "ragas>=0.2,<0.3",
    "datasets>=3.0",
    "langchain-openai>=0.2",
]
# Installing this extra currently breaks `mypy`: it pulls in numpy, whose 2.5
# stubs use 3.12-only `type` statements while [tool.mypy] is pinned to 3.11
# (matching the 3.11 Dockerfile). Nothing here imports numpy — pgvector does —
# and no mypy override suppresses it, because the stub fails at parse time
# before per-module config applies.
#
# CI installs no extras and never sees it. Locally it matters, because mypy
# runs before pytest and a red mypy skips the whole suite — the LEG-78/80
# failure mode. Until numpy is pinned here, run `uv sync --extra dev` (without
# --extra evals) before running the checks.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundation", "src/routers", "src/services", "src/repositories", "src/parsers", "src/chunkers", "src/embeddings", "src/graph", "src/observability"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["foundation", "parsers", "chunkers", "embeddings", "graph", "observability"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["foundation", "routers", "services", "repositories", "parsers", "chunkers", "embeddings", "graph", "observability"]
strict = true
warn_unused_configs = true
warn_return_any = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=foundation --cov=routers --cov=parsers --cov=chunkers --cov=repositories --cov=services --cov=embeddings --cov=graph --cov=observability --cov=main --cov=worker_main --cov-report=term-missing"
